<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body{
            background-color: rgb(255, 255, 255);
        }
        .card{
            display: flex;
            justify-content: center;
            margin-top:150px;
        }
        .container{
            border: 1px solid rgb(249, 252, 253);
            border-radius: 5px;
            box-shadow: 0 0 10px rgb(59, 130, 246, 0.2);
            height: 350px;
            width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        form{
            padding: 20px;
            display:flex;
            flex-direction: column;
            width: 400px;
            
        }
        input{
            padding:10px;
            border-radius: 10px;
            outline:none;
           
        }
        .btn{
            background-color: rgb(90, 146, 237);
            padding:10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="card">
    <div class="container">
        <h1>Login</h1>
        <form>
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="Enter email">
            <br>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Password">
            <br>
            <input type="submit" class="btn" value="Login">
        </form>
    </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinchan</title>
     <style>
       body{
            margin:0;
            height:100vh;

            background-image: url("house.png");
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-attachment: fixed;
        }
      .shinchan{
            margin-top: 400px;
      }
    </style>
</head>
<body onclick="playMusic()">
    <audio id="music" loop hidden>
        <source src="shinchaan.mp3" type="audio/mp3">
    </audio>
    <marquee scrollamount="15" direction="right" behavior="alternate">
        <img class="shinchan" src="giphy.gif">
        <img class="shinchan" src="shero.gif">

        <img class="shinchan" src="boo.gif">
        
    </marquee>

     <script>
        function playMusic()
        {
            document.getElementById("music").play();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display:flex;
            justify-content: center;
            align-items: center;
            height:100vh;
        }
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1A4341;
            height:400px;
            width: 500px;
        }
        .b{
            display:flex;
            justify-content: center;
            align-items: center;
        }
        .box1{
            background-color: #EBE77E;
            height:250px;
            width:300px;
        }
        .box2{
            height:150px;
            width:150px;
            border-radius: 50%;
            background: linear-gradient(
                to bottom,
                #84BE8D 50%,
                #1A4341 50%
            );
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="b box1">
            <div class="b box2">

            </div>
        </div>
    </div>
</body>
</html>

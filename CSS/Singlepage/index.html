    <style>
        *{
            box-sizing: content-box;
        }
        body{
            background-image: url('https://www.shutterstock.com/image-vector/color-gradient-background-abstract-orange-600nw-2480677725.jpg');
            background-repeat: no-repeat;
            background-size: 100%;
        }
        .header{
            display:flex;
            justify-content: space-between;
            align-items: center;
            padding:10px 70px;
        }
        .logo{
            display:flex;
            align-items: center;
        }
        .nav{
            display:flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }
        .nav a{
            text-decoration: none;
            color: white;
        }
        .search-box{
            display:flex;
            padding:10px;
            border-radius: 10px;
        
        }
        .ip-search{
            padding:10px;
            border: 1px solid rgb(231, 85, 22);
            
        }
        .ip-search:focus {
            border: 2px solid rgb(231, 85, 22);
            outline: none;
        }
        .btn{
            background-color: rgb(231, 85, 22);
            width:100px;
            cursor: pointer;
        }
        .section{
            display:flex;
            justify-content: space-between;
            margin:50px 50px;
        }
        .image img{
            width:30px;
            height:30px;
            flex:1;
        }
        .join{
            width:100px;
            height:30px;
            border-radius: 10px;
            border-color: aliceblue;
            background-color: rgb(231, 85, 22);
            text-align: center;
        }
        .login-here,.login-btn{
            width:200px;
            height:30px;
            border-radius: 10px;
            border-color: aliceblue;
            background-color: rgb(231, 85, 22);
            text-align: center;

        }
        .section-content{
            display:flex;
            flex-direction:column;
        }
        .inp{
            display:flex;
            flex-direction:column;
            width:200px;
            margin:20px;
        }
        .inp .text{
            padding:10px;
        }
        .login{
            display:flex;
            flex-direction:column;
            background-color: black;
            width:20%;
            color:white;
            justify-content: space-around;
            align-items: center;
            padding:20px;
            border-radius:10px;
            gap:20px;

        }
    </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display:grid;
            place-content: center;
            height:100vh;
        }
        .border{
            display:grid;
            grid-template: repeat(3,1fr)/repeat(3,1fr);
            width:400px;
            height:400px;
            
        }
        .box{
            background-color: #D58BDD;
            padding:5px;
            border: 1px solid #000000;
            color:white;
            font-size: 100px;
            text-align: center;
        }
        .box:hover{
            background-color: #000000;
        }
        #win{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 id="win"></h1>
        <div class="border">
            <div class="box b1"></div>
            <div class="box b2"></div>
            <div class="box b3"></div>
            <div class="box b4"></div>
            <div class="box b5"></div>
            <div class="box b6"></div>
            <div class="box b7"></div>
            <div class="box b8"></div>
            <div class="box b9"></div>
        </div>

</body>
<script>
    const boxes = document.querySelectorAll('.box');
    const head=document.querySelector('#win');
    let currentPlayer = "X";
    let gameover=false;
    let board = ["","","","","","","","",""];

    const winPatterns = [
        [0,1,2],
        [3,4,5],
        [6,7,8],

        [0,3,6],
        [1,4,7],
        [2,5,8],

        [0,4,8],
        [2,4,6]
    ];

    boxes.forEach((box,index)=>{

        box.addEventListener('click',()=>{

            // prevent overwrite
            if(board[index] !== "" || gameover)
                return;

            // update board
            board[index] = currentPlayer;

            // update UI
            box.innerHTML = currentPlayer;

            // check winner
            checkWinner();
            if(!board.includes('') && !gameover)
            {
                head.innerHTML="Draw!";
                gameover=true;
            }
            // switch player
            currentPlayer = currentPlayer === "X" ? "O" : "X";

        });

    });
    //Double click on the window to see the board[]
    window.addEventListener('dblclick',()=>{
        console.log(board);
    })
    function checkWinner()
    {
        for(let pattern of winPatterns)
        {
            let [a,b,c] = pattern;

            if(
                board[a] &&
                board[a] === board[b] &&
                board[b] === board[c]
            )
            {
                console.log(board[a] + " wins 🎉");
                head.innerHTML=`${board[a]} wins 🎉`;
                gameover=true;
                return;
            }
        }
    }
</script>

</html>
